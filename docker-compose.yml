services:
  nfsen:
    build:
      context: .
      args:
        NFDUMP_VERSION: 1.7.8
        NFSEN_VERSION: 1.3.11
    image: ${NFSEN_IMAGE:-nfsen:1.3.11-nfdump1.7.8}
    container_name: nfsen
    hostname: nfsen
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "8080:80"
      - "4445-4453:4445-4453/udp"
    volumes:
      - ${NFSEN_DATA_DIR:-./data}:/data
      - ./sources.json:/etc/nfsen/sources.json:ro
      - /etc/localtime:/etc/localtime:ro
