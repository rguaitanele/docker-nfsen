stages:
  - build

variables:
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_TLS_CERTDIR: ""
  NFDUMP_VERSION: "1.7.8"
  NFSEN_REPOSITORY: "rguaitanele/nfsen"
  NFSEN_VERSION: "1.3.11-blz.1"

build-container:
  stage: build
  image: docker:27-cli
  services:
    - name: docker:27-dind-rootless
      alias: docker
      command: ["--tls=false"]
  before_script:
    - |
      if [ -z "${CI_REGISTRY:-}" ] || [ -z "${CI_REGISTRY_IMAGE:-}" ]; then
        echo "ERRO: o Container Registry não está habilitado nesta instância do GitLab."
        echo "Configure registry_external_url no GitLab antes de executar este pipeline."
        exit 1
      fi
    - docker info
    - echo "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        VERSION="$CI_COMMIT_TAG"
      else
        VERSION="dev"
      fi
      IMAGE="$CI_REGISTRY_IMAGE:$VERSION"
      docker build --pull \
        --build-arg NFDUMP_VERSION="$NFDUMP_VERSION" \
        --build-arg NFSEN_REPOSITORY="$NFSEN_REPOSITORY" \
        --build-arg NFSEN_VERSION="$NFSEN_VERSION" \
        --tag "$IMAGE" .
      docker push "$IMAGE"
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$IMAGE" "$CI_REGISTRY_IMAGE:latest"
        docker push "$CI_REGISTRY_IMAGE:latest"
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_COMMIT_TAG'
