stages:
  - build

variables:
  STORAGE_DRIVER: "vfs"
  BUILDAH_FORMAT: "docker"
  BUILDAH_ISOLATION: "chroot"
  NFDUMP_VERSION: "1.7.8"
  NFSEN_VERSION: "1.3.11"

build-container:
  stage: build
  image: quay.io/buildah/stable
  before_script:
    - |
      if [ -z "${CI_REGISTRY:-}" ] || [ -z "${CI_REGISTRY_IMAGE:-}" ]; then
        echo "ERRO: o Container Registry não está habilitado nesta instância do GitLab."
        echo "Configure registry_external_url no GitLab antes de executar este pipeline."
        exit 1
      fi
    - echo "$CI_REGISTRY_PASSWORD" | buildah login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        VERSION="$CI_COMMIT_TAG"
      else
        VERSION="dev"
      fi
      IMAGE="$CI_REGISTRY_IMAGE:$VERSION"
      buildah bud --pull-always \
        --isolation "$BUILDAH_ISOLATION" \
        --build-arg NFDUMP_VERSION="$NFDUMP_VERSION" \
        --build-arg NFSEN_VERSION="$NFSEN_VERSION" \
        --tag "$IMAGE" .
      buildah push "$IMAGE"
      if [ -n "$CI_COMMIT_TAG" ]; then
        buildah tag "$IMAGE" "$CI_REGISTRY_IMAGE:latest"
        buildah push "$CI_REGISTRY_IMAGE:latest"
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_COMMIT_TAG'
