stages:
  - build

variables:
  BUILDKITD_FLAGS: "--oci-worker-no-process-sandbox"
  NFDUMP_VERSION: "1.7.8"
  NFSEN_VERSION: "1.3.11"

build-container:
  stage: build
  image:
    name: moby/buildkit:rootless
    entrypoint: [""]
  before_script:
    - |
      if [ -z "${CI_REGISTRY:-}" ] || [ -z "${CI_REGISTRY_IMAGE:-}" ]; then
        echo "ERRO: o Container Registry não está habilitado nesta instância do GitLab."
        echo "Configure registry_external_url no GitLab antes de executar este pipeline."
        exit 1
      fi
    - mkdir -p ~/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > ~/.docker/config.json
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        VERSION="$CI_COMMIT_TAG"
        IMAGE_NAMES="$CI_REGISTRY_IMAGE:$VERSION,$CI_REGISTRY_IMAGE:latest"
      else
        VERSION="dev"
        IMAGE_NAMES="$CI_REGISTRY_IMAGE:$VERSION"
      fi
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=. \
        --opt build-arg:NFDUMP_VERSION="$NFDUMP_VERSION" \
        --opt build-arg:NFSEN_VERSION="$NFSEN_VERSION" \
        --output "type=image,name=$IMAGE_NAMES,push=true"
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_COMMIT_TAG'
